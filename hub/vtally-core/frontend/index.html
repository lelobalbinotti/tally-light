<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <link rel="alternate icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="minimum-scale=1,initial-scale=1,width=device-width"/>
  <meta name="theme-color" content="#0a0e17"/>
  <meta name="description" content="vTally Studio Hub"/>
  <link rel="apple-touch-icon" href="/logo192.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <title>vTally Studio Hub</title>
  
  <!-- Fontes Google Inter e JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       vTally Studio Design System (Idêntico ao /tally-setup)
       ========================================================================== */
    :root {
      --bg-dark: #0a0e17;
      --card-bg: rgba(16, 23, 41, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(26, 35, 60, 0.85);
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-yellow: #f59e0b;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #6366f1;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      background-color: var(--bg-dark) !important;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 40%) !important;
      background-attachment: fixed !important;
      color: var(--text-main) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
      min-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 14, 23, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* ==========================================================================
       HEADER E BARRA SUPERIOR (App Bar) - LARGURA TOTAL E DESIGN MODERNO
       ========================================================================== */
    header.MuiAppBar-root,
    .MuiAppBar-root {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      background: rgba(15, 23, 42, 0.88) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: none !important;
      border-bottom: 1px solid var(--card-border) !important;
      border-radius: 0 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45) !important;
      position: sticky !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      z-index: 1000 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .MuiToolbar-root {
      width: 100% !important;
      max-width: 1400px !important;
      margin: 0 auto !important;
      min-height: 68px !important;
      padding: 0 28px !important;
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      overflow: visible !important;
    }

    /* Logotipo vTally */
    .MuiToolbar-root img,
    img[alt="vTally"],
    img[src*="logo-with-text"] {
      width: 154px !important;
      height: 36px !important;
      display: block !important;
      margin: 0 16px 0 0 !important;
      filter: drop-shadow(0 2px 8px rgba(239, 68, 68, 0.35)) !important;
      object-fit: contain !important;
      flex-shrink: 0 !important;
    }

    /* Botões de Navegação no Topo */
    .MuiToolbar-root a.MuiButton-root,
    .MuiToolbar-root .MuiButton-root {
      color: var(--text-muted) !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      font-size: 0.88rem !important;
      text-transform: none !important;
      border-radius: 8px !important;
      padding: 8px 16px !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      background: transparent !important;
      text-decoration: none !important;
    }

    .MuiToolbar-root a.MuiButton-root:hover,
    .MuiToolbar-root .MuiButton-root:hover {
      background: rgba(255, 255, 255, 0.06) !important;
      color: var(--text-main) !important;
    }

    /* Estilo especial para o botão Configurar Tally / Flash */
    .MuiToolbar-root a.MuiButton-root[href="/flasher"] {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15)) !important;
      color: #c084fc !important;
      border: 1px solid rgba(168, 85, 247, 0.3) !important;
    }
    .MuiToolbar-root a.MuiButton-root[href="/flasher"]:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3)) !important;
      color: #ffffff !important;
    }

    /* Link do Configurador no Header */
    .nav-btn-setup {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2)) !important;
      color: #c084fc !important;
      border: 1px solid rgba(168, 85, 247, 0.35) !important;
      padding: 8px 16px !important;
      border-radius: 8px !important;
      font-size: 0.85rem !important;
      font-weight: 600 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      margin-left: auto !important;
      text-decoration: none !important;
      transition: all 0.2s ease !important;
    }

    .nav-btn-setup:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.35)) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3) !important;
    }

    /* Status Chips no Header */
    .header-status-chips {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: 12px;
    }

    .header-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .header-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* ==========================================================================
       CONTAINER E FILTROS
       ========================================================================== */
    .MuiContainer-root {
      max-width: 1400px !important;
      padding: 28px 32px !important;
    }

    /* Barra de Botões (ButtonGroup) */
    .MuiButtonGroup-root {
      background: rgba(15, 23, 42, 0.7) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 12px !important;
      padding: 4px !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 4px !important;
      margin-bottom: 24px !important;
    }

    .MuiButtonGroup-root .MuiButton-root {
      border: none !important;
      border-radius: 8px !important;
      font-family: 'Inter', sans-serif !important;
      font-weight: 600 !important;
      font-size: 0.82rem !important;
      padding: 7px 14px !important;
      color: var(--text-muted) !important;
      background: transparent !important;
      text-transform: none !important;
      transition: all 0.2s ease !important;
    }

    .MuiButtonGroup-root .MuiButton-root:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      color: var(--text-main) !important;
    }

    .MuiButtonGroup-root .MuiButton-containedPrimary {
      background: var(--primary) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35) !important;
    }

    .MuiButtonGroup-root [data-testid="hub-connected"],
    .MuiButtonGroup-root [data-testid="mixer-connected"],
    .MuiButtonGroup-root [data-testid="tallies-connected"] {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid var(--card-border) !important;
      color: #cbd5e1 !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
    }

    .MuiButtonGroup-root [data-testid="hub-connected"] svg,
    .MuiButtonGroup-root [data-testid="mixer-connected"] svg,
    .MuiButtonGroup-root [data-testid="tallies-connected"] svg {
      color: var(--accent-green) !important;
    }

    /* Alertas */
    .MuiAlert-root {
      background: rgba(16, 23, 41, 0.8) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 12px !important;
      color: var(--text-main) !important;
      margin-bottom: 20px !important;
    }

    /* ==========================================================================
       OCULTAR O CARD "CREATE WEB TALLY" (NÃO DEVE APARECER)
       ========================================================================== */
    [data-testid="tally-create"],
    .MuiPaper-root.MuiPaper-outlined,
    .MuiPaper-root:has(> button[data-testid="tally-create"]) {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
      pointer-events: none !important;
      overflow: hidden !important;
    }

    /* ==========================================================================
       CARDS DOS TALLIES
       ========================================================================== */
    .MuiPaper-root[data-testid^="tally-"] {
      background: var(--card-bg) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 16px !important;
      width: 270px !important;
      margin: 12px !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25) !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .MuiPaper-root[data-testid^="tally-"]:hover {
      transform: translateY(-4px) !important;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.35) !important;
    }

    /* ESTADO PROGRAMA (VERMELHO) */
    .MuiPaper-root[data-testid^="tally-"][data-color="program"],
    .MuiPaper-root[data-testid^="tally-"][class*="borderInProgram"] {
      border-color: rgba(239, 68, 68, 0.85) !important;
      box-shadow: 0 0 28px rgba(239, 68, 68, 0.35), 0 10px 30px rgba(0, 0, 0, 0.3) !important;
    }

    .MuiPaper-root[data-testid^="tally-"][data-color="program"] > div:first-child,
    .MuiPaper-root[data-testid^="tally-"] > div[class*="bgInProgram"] {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* ESTADO PREVIEW (VERDE) */
    .MuiPaper-root[data-testid^="tally-"][data-color="preview"],
    .MuiPaper-root[data-testid^="tally-"][class*="borderInPreview"] {
      border-color: rgba(16, 185, 129, 0.85) !important;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.35), 0 10px 30px rgba(0, 0, 0, 0.3) !important;
    }

    .MuiPaper-root[data-testid^="tally-"][data-color="preview"] > div:first-child,
    .MuiPaper-root[data-testid^="tally-"] > div[class*="bgInPreview"] {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    /* ESTADO INATIVO */
    .MuiPaper-root[data-testid^="tally-"][data-color="unpatched"] > div:first-child,
    .MuiPaper-root[data-testid^="tally-"][data-color="idle"] > div:first-child,
    .MuiPaper-root[data-testid^="tally-"] > div[class*="tallyHead"]:not([class*="bgInProgram"]):not([class*="bgInPreview"]) {
      background: rgba(30, 41, 59, 0.75) !important;
      border-bottom: 1px solid var(--card-border) !important;
      color: #e2e8f0 !important;
      font-weight: 600 !important;
    }

    /* Cabeçalho do Card */
    .MuiPaper-root[data-testid^="tally-"] > div:first-child,
    [class*="tallyHead"] {
      padding: 12px 16px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      letter-spacing: -0.01em !important;
    }

    [class*="tallyHead"] button,
    [class*="tallyHead"] .MuiIconButton-root {
      color: inherit !important;
      opacity: 0.85;
      padding: 6px !important;
      transition: opacity 0.2s ease !important;
    }
    [class*="tallyHead"] button:hover,
    [class*="tallyHead"] .MuiIconButton-root:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1) !important;
    }

    /* Corpo do Card */
    .MuiPaper-root[data-testid^="tally-"] > div:nth-child(2),
    [class*="tallyBody"] {
      padding: 18px 16px !important;
    }

    /* Select de Cenas */
    .MuiPaper-root[data-testid^="tally-"] select,
    .MuiPaper-root[data-testid^="tally-"] .MuiSelect-root,
    .MuiPaper-root[data-testid^="tally-"] .MuiInputBase-root select,
    .MuiInputBase-root select {
      background: var(--input-bg) !important;
      border: 1px solid var(--input-border) !important;
      border-radius: 8px !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.92rem !important;
      padding: 10px 14px !important;
      width: 100% !important;
      outline: none !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
      cursor: pointer !important;
    }

    .MuiPaper-root[data-testid^="tally-"] select:focus,
    .MuiInputBase-root select:focus {
      border-color: var(--input-focus) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
    }

    /* Rodapé do Card */
    .MuiPaper-root[data-testid^="tally-"] > div:last-child,
    [class*="tallyFoot"] {
      padding: 10px 16px !important;
      background: rgba(15, 23, 42, 0.6) !important;
      border-top: 1px solid var(--card-border) !important;
      color: var(--text-muted) !important;
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.75rem !important;
      text-transform: uppercase !important;
      font-weight: 500 !important;
      letter-spacing: 0.05em !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
    }

    [class*="tallyFootMissing"] {
      background: rgba(245, 158, 11, 0.15) !important;
      color: #f59e0b !important;
      border-top-color: rgba(245, 158, 11, 0.3) !important;
    }

    /* ==========================================================================
       PÁGINAS DE CONFIGURAÇÃO E FLASHER (/config e /flasher)
       ========================================================================== */
    .MuiContainer-maxWidthSm {
      max-width: 680px !important;
      margin: 28px auto !important;
      padding: 0 16px !important;
    }

    /* Cards do MiniPage (/config e /flasher) */
    .MuiContainer-maxWidthSm > .MuiPaper-root {
      background: var(--card-bg) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 16px !important;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35) !important;
      overflow: hidden !important;
      margin-bottom: 28px !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .MuiContainer-maxWidthSm > .MuiPaper-root:hover {
      border-color: rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.45) !important;
    }

    /* Cabeçalho do Card (MiniPage Header) */
    .MuiContainer-maxWidthSm > .MuiPaper-root > div:first-child {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      padding: 18px 24px !important;
      background: rgba(15, 23, 42, 0.85) !important;
      border-bottom: 1px solid var(--card-border) !important;
    }

    /* Títulos dentro das páginas de configuração */
    .MuiContainer-maxWidthSm h1 {
      font-family: 'Inter', sans-serif !important;
      font-size: 1.28rem !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      letter-spacing: -0.02em !important;
      margin: 0 !important;
    }

    .MuiContainer-maxWidthSm h4 {
      font-family: 'Inter', sans-serif !important;
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      color: #f1f5f9 !important;
      margin-top: 24px !important;
      margin-bottom: 16px !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
      padding-bottom: 8px !important;
    }

    .MuiContainer-maxWidthSm h6 {
      font-family: 'Inter', sans-serif !important;
      font-size: 0.95rem !important;
      font-weight: 600 !important;
      color: #cbd5e1 !important;
      margin-bottom: 8px !important;
    }

    .MuiContainer-maxWidthSm p,
    .MuiContainer-maxWidthSm .MuiTypography-paragraph {
      color: var(--text-muted) !important;
      font-size: 0.9rem !important;
      line-height: 1.6 !important;
    }

    /* Conteúdo interno do Card */
    .MuiContainer-maxWidthSm > .MuiPaper-root > div:last-child {
      padding: 24px !important;
    }

    /* ==========================================================================
       CAMPOS DE FORMULÁRIO (TEXTFIELD, LABELS E UNDERLINES)
       ========================================================================== */
    .MuiFormControl-root.MuiTextField-root {
      margin-top: 10px !important;
      margin-bottom: 20px !important;
      position: relative !important;
      padding-top: 26px !important;
      display: inline-flex !important;
      flex-direction: column !important;
      width: auto !important;
      min-width: 230px !important;
    }

    /* Rótulo superior estático e elegante (sem sobreposição com o texto) */
    .MuiInputLabel-root {
      position: absolute !important;
      top: 2px !important;
      left: 0 !important;
      transform: none !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.74rem !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      color: var(--text-muted) !important;
      pointer-events: none !important;
    }

    .MuiInputLabel-root.Mui-focused {
      color: #818cf8 !important;
    }

    .MuiInputLabel-root.Mui-error {
      color: #f87171 !important;
    }

    /* Caixa do Input */
    .MuiInputBase-root {
      background: var(--input-bg) !important;
      border: 1px solid var(--input-border) !important;
      border-radius: 8px !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
      overflow: hidden !important;
      margin-top: 0 !important;
    }

    /* Remove sublinhados nativos do Material-UI */
    .MuiInput-underline:before,
    .MuiInput-underline:after,
    .MuiFilledInput-underline:before,
    .MuiFilledInput-underline:after {
      display: none !important;
    }

    .MuiInputBase-input {
      padding: 10px 14px !important;
      color: #f8fafc !important;
      font-family: 'JetBrains Mono', 'Inter', monospace !important;
      font-size: 0.92rem !important;
      height: auto !important;
      box-sizing: border-box !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
    }

    .MuiInputBase-root.Mui-focused,
    .MuiInputBase-root:focus-within {
      border-color: var(--input-focus) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
    }

    .MuiInputBase-root.Mui-error {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
    }

    .MuiFormHelperText-root {
      font-family: 'Inter', sans-serif !important;
      font-size: 0.78rem !important;
      margin-top: 4px !important;
      color: var(--text-muted) !important;
    }

    .MuiFormHelperText-root.Mui-error {
      color: #f87171 !important;
    }

    /* Multiline / Textarea no Flasher */
    .MuiInputBase-multiline {
      padding: 12px 14px !important;
    }

    .MuiInputBase-multiline textarea {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 0.85rem !important;
      line-height: 1.6 !important;
      color: #38bdf8 !important;
      background: transparent !important;
    }

    /* ==========================================================================
       SELECTS (OBS MIXER, CENAS E ON-AIR STATUS)
       ========================================================================== */
    .MuiSelect-root,
    .MuiNativeSelect-root,
    select.MuiSelect-select,
    select.MuiNativeSelect-select {
      background: var(--input-bg) !important;
      border: 1px solid var(--input-border) !important;
      border-radius: 8px !important;
      color: var(--text-main) !important;
      font-family: 'Inter', sans-serif !important;
      font-size: 0.92rem !important;
      padding: 10px 36px 10px 14px !important;
      outline: none !important;
      cursor: pointer !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }

    .MuiSelect-root:focus,
    .MuiNativeSelect-root:focus,
    select.MuiSelect-select:focus,
    select.MuiNativeSelect-select:focus {
      border-color: var(--input-focus) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
    }

    .MuiSelect-icon,
    .MuiNativeSelect-icon {
      color: var(--text-muted) !important;
      right: 10px !important;
    }

    select option {

  <!-- Injeção do Link e Chips no Header Superior -->
  <script>
    (function initVtallyHeader() {
      // 1. Interceptação global de cliques para navegação imediata ao configurador
      document.addEventListener('click', function(e) {
        var target = e.target && e.target.closest ? e.target.closest('a[href="/flasher"], a[href="/tally-setup"]') : null;
        if (target) {
          e.preventDefault();
          e.stopPropagation();
          window.location.href = '/tally-setup';
        }
      }, true);

      // 2. Customização da barra de navegação sem loops nem sobrecarga
      function customizeToolbar() {
        var toolbar = document.querySelector('.MuiToolbar-root');
        if (!toolbar) return false;

        if (toolbar.getAttribute('data-vtally-custom') === 'true') {
          return true;
        }
        toolbar.setAttribute('data-vtally-custom', 'true');

        // Corrige tamanho e estilo do logotipo
        var logoImg = toolbar.querySelector('img');
        if (logoImg) {
          logoImg.style.setProperty('width', '154px', 'important');
          logoImg.style.setProperty('height', '36px', 'important');
          logoImg.style.setProperty('display', 'block', 'important');
          logoImg.style.setProperty('object-fit', 'contain', 'important');
          logoImg.style.setProperty('filter', 'drop-shadow(0 2px 8px rgba(239, 68, 68, 0.35))', 'important');
        }

        // Renomeia o botão Flash para "Configurar Tally"
        var flasherBtn = toolbar.querySelector('a[href="/flasher"]');
        if (flasherBtn) {
          var label = flasherBtn.querySelector('.MuiButton-label');
          if (label) {
            label.textContent = 'Configurar Tally';
          } else {
            flasherBtn.textContent = 'Configurar Tally';
          }
        }

        // Injeta chips informativos de status se não existirem
        if (!document.getElementById('header-chips-container')) {
          var chips = document.createElement('div');
          chips.id = 'header-chips-container';
          chips.className = 'header-status-chips';
          chips.innerHTML = '<span class="header-chip"><span class="header-dot"></span>OBS 30</span>' +
                            '<span class="header-chip"><span class="header-dot"></span>Hub Online</span>';
          toolbar.appendChild(chips);
        }

        // Remove card "Create Web Tally" se estiver no DOM
        var createBtn = document.querySelector('[data-testid="tally-create"]');
        if (createBtn) {
          var parentCard = createBtn.closest('.MuiPaper-root');
          if (parentCard && parentCard.id !== 'root' && !parentCard.classList.contains('MuiContainer-root')) {
            parentCard.style.setProperty('display', 'none', 'important');
          }
        }

        return true;
      }

      // Tenta inicializar assim que a barra estiver no DOM e encerra
      var count = 0;
      var interval = setInterval(function() {
        count++;
        if (customizeToolbar() || count > 40) {
          clearInterval(interval);
        }
      }, 100);

      window.addEventListener('DOMContentLoaded', customizeToolbar);
      window.addEventListener('load', customizeToolbar);
    })();
  </script>
